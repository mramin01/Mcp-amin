[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iran-super-shop-mcp"
version = "2.0.0"
description = "Unified Iranian E-Commerce Meta-Search, Price History & Multi-Store Basket Optimizer MCP Server"
readme = "README_IRAN_SUPER_SHOP_MCP.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Mohammad Amin Talebi", email = "mramin01.dev@gmail.com" }
]
dependencies = [
  "mcp[cli]>=1.2.0",
  "httpx>=0.27.0",
]

[project.scripts]
iran-super-shop-mcp = "iran_super_shop_mcp:main"

[tool.hatch.build.targets.wheel]
include = ["iran_super_shop_mcp.py"]
